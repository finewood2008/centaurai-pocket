[project]
name = "centaurai-pocket-api"
version = "0.1.0"
description = "Single-owner private data governance API for CentaurAI Pocket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
centaur-pocket-api = "centaur_pocket.main:run"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centaur_pocket"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# FastAPI intentionally expresses request dependencies as default values.
ignore = ["B008"]
